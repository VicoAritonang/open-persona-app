name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Module is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build the Lambda bootstrap and the EC2 server
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -trimpath -o /tmp/bootstrap ./cmd/openpersona-lambda
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/openpersona-cloud ./cmd/openpersona-cloud
